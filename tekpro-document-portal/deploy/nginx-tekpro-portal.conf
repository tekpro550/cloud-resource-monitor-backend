# Nginx reverse proxy with TLS termination (certificates via certbot / Let's Encrypt).
# The Node process listens on 127.0.0.1:3000 and serves both the API and the SPA.
server {
    listen 80;
    listen [::]:80;
    server_name portal.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name portal.example.com;

    ssl_certificate     /etc/letsencrypt/live/portal.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portal.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # File contents never pass through this proxy (they go browser <-> object storage),
    # so request bodies are small JSON documents.
    client_max_body_size 1m;
    proxy_read_timeout 60s;

    # Do not log query strings: password-reset links carry a token.
    log_format portal '$remote_addr - [$time_local] "$request_method $uri" $status $body_bytes_sent $request_time';
    access_log /var/log/nginx/tekpro-portal.access.log portal;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
    }
}
