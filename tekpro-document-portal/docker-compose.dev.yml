# Local development services only. Not for production.
#   PostgreSQL 16  -> localhost:${PORTAL_PG_PORT:-5432}
#   moto (S3-compatible test server, stands in for the Lightsail bucket) -> localhost:${PORTAL_S3_PORT:-5050}
# moto keeps objects in memory: restarting it loses uploaded files.
name: tekpro-portal-dev
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: portal
      POSTGRES_DB: tekpro_portal
    ports:
      - "${PORTAL_PG_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal -d tekpro_portal"]
      interval: 2s
      timeout: 3s
      retries: 30
  s3:
    image: motoserver/moto:latest
    ports:
      - "${PORTAL_S3_PORT:-5050}:5000"
volumes:
  pgdata:
